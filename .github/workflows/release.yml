name: Release

on:
  push:
    branches: [develop]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      # Publish only when this run creates a new release (merge of a release PR)
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      # Node 26 required: `npm stage publish` needs npm >= 11.15 (Node 22 ships npm 10)
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run typecheck
        if: ${{ steps.release.outputs.release_created }}

      - run: npm test
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm stage publish
        if: ${{ steps.release.outputs.release_created }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
